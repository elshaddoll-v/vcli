[package]
name = "vcli"
version = "0.1.0"
edition = "2021"
authors = ["vcli contributors"]
description = "A declarative package management CLI tool for Void Linux, inspired by dcli/NixOS"
license = "0BSD"

[[bin]]
name = "vcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
env_logger = "0.11"
log = "0.4"
walkdir = "2.5"
glob = "0.3"
which = "7.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
hostname = "0.4"
indicatif = "0.17"
tempfile = "3.8"
dirs = "5.0"
libc = "0.2"
toml = "0.8"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
strip = true
